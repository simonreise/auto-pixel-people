[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autopp"
version = "0.1.0"
description = "Automation scripts for the Android game Pixel People using ADB and OpenCV"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "autopp contributors" }
]
keywords = [
    "pixel-people",
    "android",
    "adb",
    "automation",
    "bot",
    "opencv",
    "computer-vision",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "adbutils>=2.12.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
]

[project.urls]
Repository = "https://github.com/yourusername/autopp"

[tool.setuptools]
py-modules = ["actions", "animals", "screen", "utopium"]

[tool.setuptools.package-data]
"*" = ["*.png"]
